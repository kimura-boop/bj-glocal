<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hero</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    opacity: 0.6;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.0) 0%,
      rgba(0,0,0,0.0) 30%,
      rgba(0,0,0,0.65) 65%,
      rgba(0,0,0,0.95) 100%
    );
  }
  .hero-topline {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: #cc1f1f;
    z-index: 4;
  }
  .hero-content {
    position: relative;
    z-index: 3;
    padding: 0 60px 64px;
    max-width: 900px;
  }
  .hero-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: #cc1f1f;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hero-eyebrow::before {
    content: '';
    display: inline-block;
    width: 32px;
    height: 1px;
    background: #cc1f1f;
  }
  .hero-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(40px, 5.5vw, 76px);
    font-weight: 900;
    color: #ffffff;
    line-height: 1.0;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  .hero-divider {
    width: 48px;
    height: 2px;
    background: #cc1f1f;
    margin-bottom: 24px;
  }
  .hero-sub {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: clamp(13px, 1.5vw, 16px);
    color: rgba(255,255,255,0.82);
    line-height: 2.2;
    margin-bottom: 28px;
  }
  .hero-lead {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: clamp(11px, 1.2vw, 13px);
    color: rgba(255,255,255,0.52);
    line-height: 2.1;
    max-width: 540px;
  }
  @media (max-width: 768px) {
    .hero-content { padding: 0 24px 48px; }
  }
</style>
</head>
<body>
<div class="hero">
  <img class="hero-img"
    src="https://u.jimcdn.com/cms/o/s4e73acd3d33eafa4/userlayout/img/img-8865-2-5-11zon.jpg?t=1779371222"
    alt="bj GLOCAL CHALLENGE">
  <div class="hero-overlay"></div>
  <div class="hero-topline"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">bj GLOCAL CHALLENGE</p>
    <h1 class="hero-main">世界は、夢ではなく<br>選択肢になる。</h1>
    <div class="hero-divider"></div>
    <p class="hero-sub">アメリカは才能を選ぶ。<br>欧州は才能を育てる。</p>
    <p class="hero-lead">欧州クラブ育成体験・国際大会参戦・欧州挑戦を通じて、<br>育成年代選手たちへ世界基準の経験を提供する国際育成プロジェクト。</p>
  </div>
</div>
</body>
</html>
