<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bj GLOCAL CHALLENGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .glocal-section {
    background: #111111;
    padding: 80px 24px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* ===== HEADER ===== */
  .glocal-header {
    text-align: center;
    margin-bottom: 56px;
  }
  .glocal-header .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: #cc1f1f;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .glocal-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 16px;
  }
  /* 赤いアンダーライン */
  .glocal-header h2 span {
    display: inline-block;
    border-bottom: 3px solid #cc1f1f;
    padding-bottom: 6px;
  }
  .glocal-header p {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ===== GRID ===== */
  .glocal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ===== CARD ===== */
  .glocal-card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 3/4;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    text-decoration: none;
  }

  .glocal-card img.card-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    filter: brightness(0.6) saturate(0.75);
  }
  .glocal-card:hover img.card-bg {
    transform: scale(1.06);
    filter: brightness(0.45) saturate(0.8);
  }

  /* 赤ライン（左ボーダー） — ホバー時に出現 */
  .glocal-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 0;
    background: #cc1f1f;
    z-index: 4;
    transition: height 0.35s ease;
  }
  .glocal-card:hover::before { height: 100%; }

  /* グラデーションオーバーレイ */
  .glocal-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 55%, rgba(0,0,0,0.1) 100%);
    z-index: 2;
  }

  .card-body {
    position: relative;
    z-index: 3;
    padding: 28px 24px 28px 28px;
    transform: translateY(6px);
    transition: transform 0.4s ease;
  }
  .glocal-card:hover .card-body { transform: translateY(0); }

  /* バッジ */
  .card-badge {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 3px 10px;
    border: 1px solid rgba(204,31,31,0.6);
    color: #ff6b6b;
    margin-bottom: 12px;
  }
  /* JAPAN UN1TED は赤バッジを強調 */
  .card-united .card-badge {
    background: #cc1f1f;
    border-color: #cc1f1f;
    color: #ffffff;
  }

  /* タイトルエリア */
  .card-title-wrap {
    margin-bottom: 10px;
  }

  /* テキストタイトル（GLOCAL ACADEMY / EURO TRYOUT） */
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(24px, 3.2vw, 36px);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    line-height: 1.05;
  }

  /* JAPAN UN1TED ロゴ画像 */
  .card-logo {
    width: 85%;
    max-width: 240px;
    height: auto;
    display: block;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
  }

  .card-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    line-height: 1.75;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.4s ease;
    opacity: 0;
  }
  .glocal-card:hover .card-desc {
    max-height: 100px;
    opacity: 1;
  }

  .card-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffffff;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.35s ease 0.05s, transform 0.35s ease 0.05s;
  }
  .card-cta::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 1px;
    background: #cc1f1f;
    transition: width 0.25s ease;
  }
  .glocal-card:hover .card-cta {
    opacity: 1;
    transform: translateY(0);
  }
  .glocal-card:hover .card-cta::before { width: 32px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .glocal-section { padding: 48px 0; }
    .glocal-grid {
      grid-template-columns: 1fr;
      gap: 3px;
    }
    .glocal-card { aspect-ratio: 16/9; }
    .card-desc { max-height: none; opacity: 1; }
    .card-cta  { opacity: 1; transform: none; }
    .glocal-card::before { width: 100%; height: 4px; transition: none; }
  }
</style>
</head>
<body>

<section class="glocal-section">

  <div class="glocal-header">
    <p class="eyebrow">bj GLOCAL CHALLENGE</p>
    <h2><span>3 PROGRAMS</span></h2>
    <p>地域に根ざしながら、世界へ挑戦する。<br>育成年代に世界基準の経験を届ける3つのプログラム。</p>
  </div>

  <div class="glocal-grid">

    <!-- ① GLOCAL ACADEMY -->
    <a href="/glocal-academy" class="glocal-card card-academy">
      <!--
        src を Jimdo にアップロードした画像URLに差し替えてください
        使用写真: Glocalacademy.JPG（Movistar Academy での練習シーン）
      -->
      <img class="card-bg" src="Glocalacademy.JPG" alt="GLOCAL ACADEMY — Movistar Academyでの練習の様子">
      <div class="card-body">
        <span class="card-badge">Open Program</span>
        <div class="card-title-wrap">
          <p class="card-title">GLOCAL<br>ACADEMY</p>
        </div>
        <p class="card-desc">欧州プロ球団が開催するキャンプへ参加できる育成プログラム。誰でも申し込み可能。</p>
        <span class="card-cta">詳細を見る</span>
      </div>
    </a>

    <!-- ② JAPAN UN1TED -->
    <a href="/japan-un1ted" class="glocal-card card-united">
      <!--
        src を Jimdo にアップロードした画像URLに差し替えてください
        使用写真: Japan_Un1ted.JPG（メダル・トロフィー集合写真）
      -->
      <img class="card-bg" src="Japan_Un1ted.JPG" alt="JAPAN UN1TED — スペイン国際大会での集合写真">
      <div class="card-body">
        <span class="card-badge">Selection</span>
        <div class="card-title-wrap">
          <!--
            src を Jimdo にアップロードした画像URLに差し替えてください
            使用画像: JAPANUNITED_whs_2.png（公式ロゴ・白黒背景透過版）
          -->
          <img class="card-logo" src="JAPANUNITED_whs_2.png" alt="JAPAN UN1TED bj GLOCAL CHALLENGE">
        </div>
        <p class="card-desc">全国から集まった選手が世界を相手に挑む国際大会選抜プロジェクト。</p>
        <span class="card-cta">詳細を見る</span>
      </div>
    </a>

    <!-- ③ EURO TRYOUT -->
    <a href="/euro-tryout" class="glocal-card card-tryout">
      <!--
        src を Jimdo にアップロードした画像URLに差し替えてください
        使用写真: bjglocal.jpg（Movistar Arena 満員俯瞰）
      -->
      <img class="card-bg" src="bjglocal.jpg" alt="EURO TRYOUT — 欧州プロアリーナ">
      <div class="card-body">
        <span class="card-badge">Year-round</span>
        <div class="card-title-wrap">
          <p class="card-title">EURO<br>TRYOUT</p>
        </div>
        <p class="card-desc">欧州クラブへ選手・コーチとして挑戦するキャリアチャレンジプログラム。通年相談受付中。</p>
        <span class="card-cta">相談する</span>
      </div>
    </a>

  </div>
</section>

</body>
</html>
